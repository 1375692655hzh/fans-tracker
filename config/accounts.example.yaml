# ============================================================
# 账号清单模板 —— 首次使用: 复制本文件为 accounts.yaml
#   (或直接在控制台「账号管理」页添加, 会自动生成)
#
# 字段说明:
#   platform 平台标识(必填), 可用值:
#     futu 富途 | xueqiu 雪球 | changqiao 长桥 | eastmoney 东方财富
#     laohu 老虎 | ths 同花顺 | weibo 微博
#     zhihu 知乎 | bilibili B站 | xhs 小红书 | douyin 抖音 | kuaishou 快手
#     x X(Twitter) | youtube YouTube
#     weixin_gzh 公众号(预留) | weixin_sph 视频号(预留)
#   owner     账号所有人(必填, 填到表格第一列)
#   name      账号名称(可留空, 抓取时自动用平台昵称)
#   url       账号主页链接(x/youtube 之外的平台必填)
#   handle    仅 x / youtube 需要: @后面的字符串(不带@)
#
# 需要登录态的平台先执行: python main.py login <platform>
# ============================================================
accounts:
  # 示例(去掉 # 生效):
  # - platform: futu
  #   owner: 张三
  #   name: ""
  #   url: https://q.futunn.com/profile/123456
  #
  # - platform: bilibili
  #   owner: 李四
  #   url: https://space.bilibili.com/946974
  #
  # - platform: x
  #   owner: 王五
  #   handle: elonmusk
  #
  # - platform: youtube
  #   owner: 王五
  #   handle: SomeChannel
