<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}粉丝数据追踪{% endblock %} - fans-tracker</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav>
  <span class="brand">📈 fans-tracker</span>
  <a href="/" class="{% if request.path == '/' %}on{% endif %}">仪表盘</a>
  <a href="/accounts" class="{% if request.path == '/accounts' %}on{% endif %}">账号管理</a>
  <a href="/settings" class="{% if request.path == '/settings' %}on{% endif %}">设置</a>
  <a href="https://docs.qq.com/sheet/DQU9YSmROcG9jWHNW" target="_blank">腾讯文档↗</a>
</nav>
<main>
{% block body %}{% endblock %}
</main>
<footer>fans-tracker · 每日数据自动写入腾讯文档 · <a href="https://github.com/1375692655hzh/fans-tracker" target="_blank">GitHub</a></footer>
<script src="/static/chart.umd.min.js"></script>
{% block script %}{% endblock %}
</body>
</html>
