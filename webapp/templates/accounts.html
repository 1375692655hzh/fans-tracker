{% extends "base.html" %}
{% block title %}账号管理{% endblock %}
{% block body %}
<div class="card">
  <h3 id="form-title">添加账号 <span class="muted">同事发来主页链接 → 填这里即可, 立即生效</span></h3>
  <form id="f-add" class="grid">
    <label>所属平台
      <select id="a-platform" required></select></label>
    <label>账号所有人 <input id="a-owner" placeholder="如: 张三" required></label>
    <label>账号名称 <input id="a-name" placeholder="留空自动抓昵称"></label>
    <label>主页链接 <input id="a-url" placeholder="https://… (X/YouTube 不用填)"></label>
    <label>@handle <input id="a-handle" placeholder="仅 X/YouTube: 如 owenwin888"></label>
    <button type="submit" id="btn-submit">添加</button>
    <button type="button" id="btn-cancel" style="display:none">取消编辑</button>
  </form>
  <div id="add-msg" class="muted"></div>
</div>

<div class="card">
  <h3>账号清单</h3>
  <table>
    <thead><tr><th>账号所有人</th><th>所属平台</th><th>账号名称</th>
      <th>主页链接 / @handle</th><th>登录态</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <p class="muted" id="login-hints"></p>
  <p class="muted">扫码一次长期有效; 富途主页必须登录才能看, 其余多数匿名可抓。
  抓不到时先看仪表盘的失败标记和 logs/screenshots/ 截图。</p>
</div>
{% endblock %}

{% block script %}
<script>
let PLATFORMS = [];
async function load() {
  const [acc, st] = await Promise.all([
    (await fetch("/api/accounts")).json(),
    (await fetch("/api/settings")).json()]);
  PLATFORMS = st.platforms;
  const sel = document.getElementById("a-platform");
  sel.innerHTML = PLATFORMS.map(p =>
    `<option value="${p.id}">${p.label}${p.needs_login ? "(建议登录)" : ""}</option>`).join("");
  sel.onchange = () => {
    const isApi = ["x", "youtube"].includes(sel.value);
    document.getElementById("a-url").disabled = isApi;
    document.getElementById("a-handle").disabled = !isApi;
  };
  // 按已配账号动态生成登录命令提示
  const need = [...new Set((acc.accounts || [])
    .filter(a => (PLATFORMS.find(x => x.id === a.platform) || {}).needs_login)
    .map(a => a.platform))];
  document.getElementById("login-hints").innerHTML = need.length
    ? "以下已配平台建议扫码登录一次(执行对应命令): "
      + need.map(p => `<code>python main.py login ${p}</code>`).join(" ")
    : "当前账号都不强制登录, 添加后即可抓取";
  const tb = document.getElementById("rows");
  tb.innerHTML = (acc.accounts || []).map(a => {
    const p = PLATFORMS.find(x => x.id === a.platform) || {};
    const ident = a.handle ? "@" + a.handle : (a.url || "");
    return `<tr>
      <td>${a.owner || "-"}</td><td>${a.platform_label || a.platform}</td>
      <td>${a.name || "-"}</td>
      <td class="ellip">${ident ? `<a href="${a.handle ? (a.platform === 'x' ? 'https://x.com/' + a.handle : 'https://youtube.com/@' + a.handle) : a.url}" target="_blank">${ident}</a>` : "-"}</td>
      <td>${p.needs_login ? "建议登录" : "-"}</td>
      <td class="acts">
        <button class="edit" data-p="${a.platform}" data-u="${a.url || ''}"
                data-h="${a.handle || ''}" data-owner="${a.owner || ''}"
                data-name="${a.name || ''}">编辑</button>
        <button class="del" data-p="${a.platform}" data-u="${a.url || ''}" data-h="${a.handle || ''}">删除</button>
      </td>
    </tr>`;
  }).join("");
}

let editing = null;   // null=添加模式, 否则={platform,url,handle}定位原账号

document.getElementById("f-add").onsubmit = async e => {
  e.preventDefault();
  const body = {
    platform: v("a-platform"), owner: v("a-owner"), name: v("a-name"),
    url: v("a-url"), handle: v("a-handle")};
  let r;
  if (editing) {
    r = await (await fetch("/api/accounts", {method: "PUT",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({old: editing, new: body})})).json();
  } else {
    r = await (await fetch("/api/accounts", {method: "POST",
      headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)})).json();
  }
  document.getElementById("add-msg").textContent = r.msg;
  if (r.ok) { exitEdit(); load(); }
};
const v = id => document.getElementById(id).value.trim();

function exitEdit() {
  editing = null;
  document.getElementById("f-add").reset();
  document.getElementById("form-title").firstChild.textContent = "添加账号 ";
  document.getElementById("btn-submit").textContent = "添加";
  document.getElementById("btn-cancel").style.display = "none";
}
document.getElementById("btn-cancel").onclick = exitEdit;

document.getElementById("rows").addEventListener("click", async e => {
  const t = e.target;
  if (t.classList.contains("edit")) {          // 进入编辑模式: 表单回填
    editing = {platform: t.dataset.p, url: t.dataset.u, handle: t.dataset.h};
    document.getElementById("a-platform").value = t.dataset.p;
    document.getElementById("a-owner").value = t.dataset.owner;
    document.getElementById("a-name").value = t.dataset.name;
    document.getElementById("a-url").value = t.dataset.u;
    document.getElementById("a-handle").value = t.dataset.h;
    document.getElementById("a-platform").onchange();
    document.getElementById("form-title").firstChild.textContent = "编辑账号 ";
    document.getElementById("btn-submit").textContent = "保存修改";
    document.getElementById("btn-cancel").style.display = "";
    document.getElementById("add-msg").textContent = "正在编辑 "
      + (t.dataset.u || "@" + t.dataset.h);
    window.scrollTo({top: 0, behavior: "smooth"});
    return;
  }
  if (!t.classList.contains("del")) return;
  if (!confirm("确认删除该账号?")) return;
  const r = await (await fetch("/api/accounts", {method: "DELETE",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({platform: t.dataset.p,
      url: t.dataset.u, handle: t.dataset.h})})).json();
  if (!r.ok) alert(r.msg);
  load();
});
load();
</script>
{% endblock %}
